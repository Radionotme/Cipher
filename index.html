<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>The Vault of Yanrish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#120e0a;
    --ink-900:#1c1611;
    --ink-800:#2a2119;
    --brass:#b8874a;
    --brass-hi:#e9c988;
    --brass-lo:#5c4322;
    --parchment:#ece0c4;
    --parchment-dim:#c9bb99;
    --verdigris:#6f9c86;
    --verdigris-hi:#9cc7b1;
    --shadow:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(120% 90% at 50% -10%, #3a352d 0%, transparent 55%),
      radial-gradient(90% 70% at 15% 90%, #2c2721 0%, transparent 60%),
      radial-gradient(90% 70% at 90% 85%, #241f19 0%, transparent 60%),
      linear-gradient(155deg, #33302a 0%, #221e19 45%, #171410 100%);
    color:var(--parchment);
    font-family:'IBM Plex Mono', monospace;
    overflow-x:hidden;
    position:relative;
  }
  .stone-grain{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    opacity:.6; mix-blend-mode:overlay; background-repeat:repeat;
  }
  html::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 60px, rgba(0,0,0,.2) 61px, rgba(0,0,0,0) 64px),
      repeating-linear-gradient(15deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 90px, rgba(0,0,0,.16) 91px, rgba(0,0,0,0) 95px);
  }

  .page{
    position:relative; z-index:1;
    max-width:620px; margin:0 auto;
    padding:56px 20px 60px;
    display:flex; flex-direction:column; align-items:center;
  }

  .eyebrow{
    font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--verdigris-hi); margin-bottom:10px;
  }
  h1{
    font-family:'Cinzel', serif; font-weight:700;
    font-size:clamp(28px, 6vw, 36px);
    letter-spacing:.03em; margin:0 0 10px;
    text-align:center;
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .sub{
    font-size:13px; color:var(--parchment-dim);
    text-align:center; max-width:420px; line-height:1.55;
    margin:0 0 40px;
  }

  .shelf{
    width:100%;
    display:flex; flex-direction:column; gap:16px;
  }

  .device{
    display:flex; align-items:center; gap:18px;
    background:linear-gradient(180deg, #241f19, #1a1611);
    border:1px solid var(--brass-lo);
    border-radius:10px;
    padding:18px 20px;
    text-decoration:none;
    color:inherit;
    box-shadow:0 10px 20px var(--shadow), inset 0 0 20px rgba(0,0,0,.35);
    transition:border-color .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  .device:hover{
    border-color:var(--brass);
    transform:translateY(-2px);
    box-shadow:0 14px 26px var(--shadow), 0 0 0 1px var(--brass-lo), inset 0 0 20px rgba(0,0,0,.35);
  }
  .device:active{ transform:translateY(0); }

  .device-icon{
    flex:0 0 auto;
    width:44px; height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass) 55%, var(--brass-lo) 100%);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    color:var(--ink-950);
    box-shadow:0 3px 6px rgba(0,0,0,.5);
  }

  .device-text{ flex:1 1 auto; min-width:0; }
  .device-title{
    font-family:'Cinzel', serif; font-weight:700; font-size:16px;
    color:var(--parchment); margin:0 0 3px;
  }
  .device-desc{
    font-size:12px; color:var(--parchment-dim); line-height:1.4; margin:0;
  }

  .device-arrow{
    flex:0 0 auto; color:var(--brass-hi); font-size:18px; opacity:.7;
  }

  .empty-slot{
    border:1px dashed var(--brass-lo);
    border-radius:10px;
    padding:18px 20px;
    text-align:center;
    font-size:11.5px;
    color:var(--parchment-dim);
    letter-spacing:.05em;
    text-transform:uppercase;
    opacity:.6;
  }

  footer{
    margin-top:44px;
    font-size:10.5px;
    color:var(--parchment-dim);
    opacity:.55;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-align:center;
  }
</style>
</head>
<body>
<div class="stone-grain" id="stoneGrain"></div>
<div class="page">
  <div class="eyebrow">Devices &amp; Mechanisms</div>
  <h1>The Vault of Yanrish</h1>
  <p class="sub">Instruments recovered from the fourfold dungeon, kept here for reference at the table.</p>

  <div class="shelf" id="shelf"></div>

  <footer>Portalmaster of Everny</footer>
</div>

<script>
(function(){
  // Stone grain texture, generated on canvas for reliable cross-device rendering.
  const size = 200;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const c = canvas.getContext('2d');
  const img = c.createImageData(size, size);
  for(let i=0;i<img.data.length;i+=4){
    const v = Math.random()*255;
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
  }
  c.putImageData(img,0,0);
  const grain = document.getElementById('stoneGrain');
  grain.style.backgroundImage = `url(${canvas.toDataURL('image/png')})`;
  grain.style.backgroundSize = size+'px '+size+'px';
})();

(function(){
  // ---- Add new devices here as they're built. Each entry needs:
  //   title  — short name shown on the card
  //   desc   — one-line description
  //   href   — the filename of the page it links to
  //   icon   — a single glyph/emoji shown in the brass roundel
  const DEVICES = [
    {
      title: "The Cipher Wheel",
      desc: "A rotating brass dial that turns letters against symbols.",
      href: "cipher-wheel.html",
      icon: "&#9737;"
    },
    {
      title: "The Alembic Panel",
      desc: "Four elemental levers feeding a basin — mix with care.",
      href: "mixing-panel.html",
      icon: "&#9879;"
    }
    // {
    //   title: "New Device Name",
    //   desc: "A short description of what it does.",
    //   href: "new-device.html",
    //   icon: "&#9670;"
    // },
  ];

  const shelf = document.getElementById('shelf');

  DEVICES.forEach(d=>{
    const a = document.createElement('a');
    a.className = 'device';
    a.href = d.href;
    a.innerHTML = `
      <div class="device-icon">${d.icon}</div>
      <div class="device-text">
        <p class="device-title">${d.title}</p>
        <p class="device-desc">${d.desc}</p>
      </div>
      <div class="device-arrow">&#8594;</div>
    `;
    shelf.appendChild(a);
  });

  const empty = document.createElement('div');
  empty.className = 'empty-slot';
  empty.textContent = 'Further devices will be added here';
  shelf.appendChild(empty);
})();
</script>
</body>
</html>
