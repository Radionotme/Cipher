# Goes at the TOP LEVEL of the repo: .github/workflows/pages.yml
name: Publish Cipher site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish DM-only data
        run: |
          if grep -rIl "DMNotes" konthra-site/site/ ; then echo "DMNotes found in published data"; exit 1; fi
          if find . -name "*.xlsx" -not -path "./.git/*" | grep -q . ; then echo "A spreadsheet is committed"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .   # whole repo, so the existing /konthra-site/site/index.html address keeps working
      - id: deployment
        uses: actions/deploy-pages@v4
