<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dramatis Personae · The Chronicles of Konthra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="lab">The Chronicles of Konthra</div>
  <h1>Dramatis Personae</h1>
  <p class="sub">Records gathered by a scholar of Konthra, for those who walk its roads.</p>
</header>
<main>
  <div class="bar">
    <label class="lab" for="q">Search</label>
    <input id="q" type="search" placeholder="Name, alias, place…" autocomplete="off">
    <div id="chips" class="chips" role="group" aria-label="Filters"></div>
    <label class="lab" for="fac">Faction</label>
    <select id="fac"><option value="">All factions</option></select>
    <span id="count" class="count" aria-live="polite"></span>
  </div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>No records match. Nothing has been approved for publication yet, or your filters are too narrow.</p>
</main>
<dialog id="modal" aria-labelledby="m-name"></dialog>
<script src="vendor/cytoscape.min.js"></script>
<script src="app.js"></script>
</body>
</html>
